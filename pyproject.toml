[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "game-review"
version = "0.1.0"
description = "Chess game review analyzer"
dependencies = [
    "chess",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["review*"]

[tool.setuptools.package-data]
review = ["data/openings/*.tsv", "data/openings/*.txt"]