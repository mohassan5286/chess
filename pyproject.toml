[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "game-review"
version = "0.1.0"
description = "Chess game review analyzer"
dependencies = [
    "chess",
    "flask"
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["data/**/*", "data/openings/*"]
